name: Deploy to EC2

on:
  push:
    branches: [ 'devsec' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_PATH: ${{ secrets.EC2_PATH }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_RESTART_SERVICE: ${{ secrets.EC2_RESTART_SERVICE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          # Write private key from secret to a temporary file and secure it
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # ensure known_hosts exists to avoid prompts (we still disable checking in scp/ssh flag)
          touch ~/.ssh/known_hosts

      - name: Copy files to EC2 via scp
        run: |
          # default port 22 if EC2_PORT not provided
          PORT=${EC2_PORT:-22}
          mkdir -p /tmp/deploy
          echo "Copying main.py and mapa.html to ${EC2_USER}@${EC2_HOST}:${EC2_PATH} (port $PORT)"
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no -P $PORT main.py mapa.html ${EC2_USER}@${EC2_HOST}:${EC2_PATH}/

      - name: (Optional) Restart remote service
        if: ${{ env.EC2_RESTART_SERVICE == 'true' }}
        run: |
          PORT=${EC2_PORT:-22}
          echo "Restarting service on remote host (via ssh)"
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -p $PORT ${EC2_USER}@${EC2_HOST} "sudo systemctl restart reportes-gps.service || echo 'service restart failed'"
