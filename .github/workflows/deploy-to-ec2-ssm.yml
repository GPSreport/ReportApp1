name: Deploy to EC2 via SSM

on:
  push:
    branches: [ 'devsec' ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-ssm:
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact to S3 (optional)
        if: false
        run: |
          # If you prefer, zip the repo and upload to S3, then fetch from instance
          zip -r /tmp/deploy.zip .
          aws s3 cp /tmp/deploy.zip s3://my-bucket/deploy.zip

      - name: Run deploy commands via SSM
        run: |
          echo "Running deploy commands on instance ${EC2_INSTANCE_ID}"
          # send command and capture CommandId
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters commands=["cd /opt/app || exit 1","/opt/app/venv/bin/git pull origin devsec || true","/opt/app/venv/bin/git reset --hard origin/devsec || true","/opt/app/venv/bin/pip3 install -r /opt/app/requirements.txt || true","sudo systemctl restart reportes-gps.service || true"] \
            --query 'Command.CommandId' --output text --region ${AWS_REGION})
          echo "SSM CommandId: $CMD_ID"

          # poll for status
          ATTEMPTS=0
          MAX=60
          SLEEP=5
          while [ $ATTEMPTS -lt $MAX ]; do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${EC2_INSTANCE_ID} --query 'Status' --output text --region ${AWS_REGION}) || true
            echo "Attempt $ATTEMPTS: status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            ATTEMPTS=$((ATTEMPTS+1))
            sleep $SLEEP
          done
          echo "Final status: $STATUS"
          # print invocation output
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${EC2_INSTANCE_ID} --region ${AWS_REGION} || true
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi

      - name: (noop) finished
        run: echo "deploy step finished"
